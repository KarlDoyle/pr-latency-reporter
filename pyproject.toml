[project]
name = "pr-latency-reporter"
version = "0.1.0"
description = "Collect PR review-latency metrics from GitHub, store them append-only in SQLite, and emit a weekly Slack digest + monthly Markdown summary — standard library only."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.11", "pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
